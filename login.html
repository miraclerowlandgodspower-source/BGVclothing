<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baggy Clothing | Login</title>

    <link rel="stylesheet" href="brand.css">
    <link rel="stylesheet" href="auth.css">
</head>

<body>

<header class="auth-header">
    <a href="index.html" class="brand-logo">
        <span class="word">BAGGY</span>
        <span class="sub">CLOTHING</span>
    </a>
</header>

<div class="auth-wrap">

    <div class="auth-card">

        <p class="eyebrow">Welcome back</p>
        <h1>Login.</h1>
        <p class="subtitle">Login to your Baggy Clothing account.</p>

        <form id="loginForm">

            <div class="field">
                <label for="loginEmail">Email Address</label>
                <input
                    type="email"
                    id="loginEmail"
                    placeholder="you@email.com"
                    required
                >
            </div>

            <div class="field">
                <label for="loginPassword">Password</label>
                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <div class="field-row">
                <label>
                    <input type="checkbox">
                    Remember me
                </label>
                <a href="#">Forgot password?</a>
            </div>

            <button type="submit" class="btn btn-primary">Login</button>

            <p id="loginMessage"></p>

        </form>

        <p class="switch">
            Don't have an account?
            <a href="register.html">Create one</a>
        </p>

    </div>

</div>

<a href="index.html" class="back-link">← Back to website</a>

<script src="config.js"></script>
<script src="script.js"></script>

</body>
</html>
